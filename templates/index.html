<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Sentiment Analysis</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #0a192f, #020c1b);
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            position: relative;
        }

        h1 {
            color: #4cc9f0;
            font-size: 3rem;
            margin-bottom: 20px;
            animation: fadeIn 2s ease-in-out;
        }

        .btn {
            background: linear-gradient(45deg, #4895ef, #4361ee);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            animation: pulse 2s infinite;
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0px 0px 20px rgba(72, 149, 239, 0.7);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .floating-circles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .circle {
            position: absolute;
            background: rgba(72, 149, 239, 0.3);
            border-radius: 50%;
            animation: float 5s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Financial Sentiment Analysis</h1>
        <button class="btn" onclick="predictSentiment()">Predict Sentiment</button>
    </div>
    <div class="floating-circles"></div>
    <script>
        function predictSentiment() {
            window.location.href = "/predict";
        }

        function createFloatingCircles() {
            const container = document.querySelector('.floating-circles');
            for (let i = 0; i < 10; i++) {
                let circle = document.createElement('div');
                let size = Math.random() * 100 + 50;
                circle.classList.add('circle');
                circle.style.width ='${size}px';
                circle.style.height = '${size}px';
                circle.style.top = '${Math.random() * 100}%';
                circle.style.left = '${Math.random() * 100}%';
                circle.style.animationDuration = '${Math.random() * 3 + 3}s';
                container.appendChild(circle);
            }
        }
        createFloatingCircles();
    </script>
</body>
</html>
